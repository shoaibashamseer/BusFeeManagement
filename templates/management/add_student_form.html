{% extends 'management/base.html' %}
{% block content %}
<div style="max-width: 800px; margin: 40px auto; padding: 30px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); font-family: system-ui, sans-serif;">
    
    <div style="border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin: 0; color: #0f172a;">➕ Register New Student Profile</h2>
        <span style="color: #64748b; font-size: 0.85rem;">* Fields marked with red bar are mandatory</span>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div style="padding: 14px; margin-bottom: 20px; border-radius: 6px; font-weight: bold; 
                {% if message.tags == 'error' %} background: #fee2e2; border: 1px solid #fca5a5; color: #b91c1c; {% else %} background: #dcfce7; border: 1px solid #bbf7d0; color: #15803d; {% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="">
        {% csrf_token %}
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            
            <div>
                <label style="display:block; margin-bottom:6px; font-weight:bold; color:#475569;">Full Name *</label>
                <input type="text" name="name" required style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box;">
            </div>
            
            <div>
                <label style="display:block; margin-bottom:6px; font-weight:bold; color:#475569;">Admission Number * (Unique)</label>
                <input type="text" name="admission_no" required style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box;">
            </div>

            <div>
                <label style="display:block; margin-bottom:6px; font-weight:bold; color:#475569;">Class / Section *</label>
                <input type="text" name="student_class" placeholder="e.g. 1 A" required style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box;">
            </div>

            <div>
                <label style="display:block; margin-bottom:6px; font-weight:bold; color:#475569;">Parent / Guardian Name *</label>
                <input type="text" name="parent" required style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box;">
            </div>

            <div>
                <label style="display:block; margin-bottom:6px; font-weight:bold; color:#475569;">Contact Phone Number</label>
                <input type="text" name="phone" placeholder="Optional" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box;">
            </div>

            <div>
                <label style="display:block; margin-bottom:6px; font-weight:bold; color:#475569;">Blood Group *</label>
                <input type="text" name="blood_group" placeholder="e.g. O+" required style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box;">
            </div>

            <div>
                <label style="display:block; margin-bottom:6px; font-weight:bold; color:#475569;">Monthly Transport Fee (₹) *</label>
                <input type="number" name="monthly_fee" value="500.00" step="0.01" required style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box;">
            </div>

            <div>
                <label style="display:block; margin-bottom:6px; font-weight:bold; color:#475569;">Assigned Route / Bus *</label>
                <select name="bus" required style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; background: white; box-sizing: border-box;">
                    <option value="">-- Select Bus Route --</option>
                    {% for bus in buses %}
                        <option value="{{ bus.id }}">{{ bus.bus_number }} - {{ bus.route_name }} ({{ bus.driver_name }})</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label style="display:block; margin-bottom:6px; font-weight:bold; color:#475569;">Photo Code Reference</label>
                <input type="text" name="photo" placeholder="Optional reference id" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box;">
            </div>

            <div>
                <label style="display:block; margin-bottom:6px; font-weight:bold; color:#1e3a8a;">QR Code String (Optional / Link Later)</label>
                <input type="text" name="qr_code" placeholder="Leave empty if linking card next time" style="width:100%; padding:10px; border:2px dashed #93c5fd; border-radius:6px; box-sizing: border-box; background: #f0f7ff;">
            </div>

        </div>

        <div style="margin-bottom: 24px;">
            <label style="display:block; margin-bottom:6px; font-weight:bold; color:#475569;">Residential Permanent Address *</label>
            <textarea name="address" rows="3" required style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box; resize: vertical;"></textarea>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 10px;">
            <a href="javascript:history.back()" style="flex-grow:1; text-align:center; padding:12px; background:#64748b; color:white; text-decoration:none; border-radius:6px; font-weight:bold; border: 1px solid #475569;">Cancel</a>
            <button type="submit" style="flex-grow:2; padding:12px; background:#16a34a; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; border: 1px solid #15803d;">Save to Database</button>
        </div>
    </form>
</div>
{% endblock %}
